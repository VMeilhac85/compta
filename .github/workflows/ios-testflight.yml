name: iOS TestFlight

run-name: TestFlight ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      next_version_code:
        description: Prochain numéro de build demandé par Maison Pilote
        required: true
        type: string
      marketing_version:
        description: Version lisible facultative, par exemple 1.111
        required: false
        default: ""
        type: string
      correlation_id:
        description: Identifiant technique unique de la demande
        required: true
        type: string

concurrency:
  group: maison-pilote-ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive-and-upload:
    name: Compiler, signer et transmettre à TestFlight
    runs-on: macos-15
    timeout-minutes: 55
    env:
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      IOS_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
      IOS_TESTFLIGHT_URL: ${{ secrets.IOS_TESTFLIGHT_URL }}
      IOS_MINIMUM_OS_VERSION: "16.4"
      IOS_WATCH_MINIMUM_OS_VERSION: "9.4"

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Contrôler la demande
        shell: bash
        env:
          NEXT_VERSION_CODE: ${{ inputs.next_version_code }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          set -euo pipefail
          [[ "$NEXT_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ -z "$MARKETING_VERSION" || "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$CORRELATION_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]]
          [[ "$IOS_DEVELOPMENT_TEAM" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$IOS_APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$IOS_APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$IOS_TESTFLIGHT_URL" =~ ^https://testflight\.apple\.com/join/[A-Za-z0-9]+/?$ ]]

      - name: Préparer XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Installer temporairement la clé App Store Connect
        shell: bash
        env:
          IOS_ASC_PRIVATE_KEY: ${{ secrets.IOS_ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$IOS_ASC_PRIVATE_KEY" ]]; then
            echo "Le secret IOS_ASC_PRIVATE_KEY est absent." >&2
            exit 66
          fi
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${IOS_APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s\n' "$IOS_ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          openssl pkey -in "$key_path" -check -noout
          echo "IOS_APP_STORE_CONNECT_API_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Installer temporairement la signature App Store
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_SHARE_BASE64 }}
          IOS_PROFILE_WATCH_BASE64: ${{ secrets.IOS_PROFILE_WATCH_BASE64 }}
          IOS_PROFILE_WATCH_EXTENSION_BASE64: ${{ secrets.IOS_PROFILE_WATCH_EXTENSION_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/maison-pilote-distribution.p12"
          decoded_profiles="$RUNNER_TEMP/maison-pilote-profiles"
          installed_profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$decoded_profiles" "$installed_profiles"

          CERTIFICATE_PATH="$certificate_path" \
          DECODED_PROFILES="$decoded_profiles" \
          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path

          values = {
              Path(os.environ["CERTIFICATE_PATH"]): "IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64",
              Path(os.environ["DECODED_PROFILES"]) / "app.mobileprovision": "IOS_PROFILE_APP_BASE64",
              Path(os.environ["DECODED_PROFILES"]) / "share.mobileprovision": "IOS_PROFILE_SHARE_BASE64",
              Path(os.environ["DECODED_PROFILES"]) / "watch.mobileprovision": "IOS_PROFILE_WATCH_BASE64",
              Path(os.environ["DECODED_PROFILES"]) / "watch-extension.mobileprovision": "IOS_PROFILE_WATCH_EXTENSION_BASE64",
          }
          for path, variable in values.items():
              encoded = os.environ.get(variable, "").strip()
              if not encoded:
                  raise SystemExit(f"Le secret {variable} est absent.")
              path.write_bytes(base64.b64decode(encoded, validate=True))
              path.chmod(0o600)
          PYTHON

          if [[ -z "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]]; then
            echo "Le mot de passe du certificat de distribution est absent." >&2
            exit 66
          fi
          keychain_path="$RUNNER_TEMP/maison-pilote-signing.keychain-db"
          keychain_password="$(openssl rand -base64 36)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          install_profile() {
            local source_path="$1"
            local environment_name="$2"
            local decoded_plist="$source_path.plist"
            local profile_uuid
            security cms -D -i "$source_path" -o "$decoded_plist"
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$decoded_plist")"
            if [[ ! "$profile_uuid" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              echo "Un profil de provisioning est invalide." >&2
              exit 65
            fi
            local installed_path="$installed_profiles/$profile_uuid.mobileprovision"
            install -m 600 "$source_path" "$installed_path"
            echo "$environment_name=$profile_uuid" >> "$GITHUB_ENV"
            echo "${environment_name}_PATH=$installed_path" >> "$GITHUB_ENV"
          }

          install_profile "$decoded_profiles/app.mobileprovision" IOS_APP_PROVISIONING_PROFILE_SPECIFIER
          install_profile "$decoded_profiles/share.mobileprovision" IOS_SHARE_PROVISIONING_PROFILE_SPECIFIER
          install_profile "$decoded_profiles/watch.mobileprovision" IOS_WATCH_PROVISIONING_PROFILE_SPECIFIER
          install_profile "$decoded_profiles/watch-extension.mobileprovision" IOS_WATCH_EXTENSION_PROVISIONING_PROFILE_SPECIFIER
          echo "IOS_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Construire et envoyer la release
        shell: bash
        env:
          MAISON_PILOTE_IOS_NEXT_VERSION_CODE: ${{ inputs.next_version_code }}
          IOS_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/release-result.json"
          export MAISON_PILOTE_IOS_RESULT_FILE="$result_file"
          chmod +x mobile/ios/maison-pilote/scripts/*.sh
          mobile/ios/maison-pilote/scripts/release.sh
          python3 -m json.tool "$result_file" >/dev/null

      - name: Conserver le manifeste de release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maison-pilote-ios-release-${{ inputs.correlation_id }}
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Résumé
        shell: bash
        run: |
          {
            echo "## Maison Pilote iOS"
            echo
            echo "L’archive a été signée et transmise à App Store Connect."
            echo "Le serveur Maison Pilote peut maintenant attendre le traitement Apple et activer TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer les éléments de signature temporaires
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/AuthKey_${IOS_APP_STORE_CONNECT_API_KEY_ID}.p8"
          rm -f -- "$RUNNER_TEMP/maison-pilote-distribution.p12"
          for profile_path in \
            "${IOS_APP_PROVISIONING_PROFILE_SPECIFIER_PATH:-}" \
            "${IOS_SHARE_PROVISIONING_PROFILE_SPECIFIER_PATH:-}" \
            "${IOS_WATCH_PROVISIONING_PROFILE_SPECIFIER_PATH:-}" \
            "${IOS_WATCH_EXTENSION_PROVISIONING_PROFILE_SPECIFIER_PATH:-}"; do
            if [[ -n "$profile_path" ]]; then
              rm -f -- "$profile_path"
            fi
          done
          if [[ -n "${IOS_SIGNING_KEYCHAIN:-}" && -f "$IOS_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$IOS_SIGNING_KEYCHAIN"
          fi
