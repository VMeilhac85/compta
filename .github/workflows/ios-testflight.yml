name: Transmettre l’archive iOS 1.131 autorisée
run-name: TestFlight ${{ inputs.correlation_id }}
on:
  workflow_dispatch:
    inputs:
      next_version_code:
        required: true
        type: string
      marketing_version:
        required: false
        default: ""
        type: string
      correlation_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: maison-pilote-ios-testflight
  cancel-in-progress: false
jobs:
  upload-prepared:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      IOS_TESTFLIGHT_URL: ${{ secrets.IOS_TESTFLIGHT_URL }}
      EXPECTED_IPA_SHA256: 82fbcd4e95110a971d02e61c95af6584082b5990eeb752486b6573e86c93b6e8
    steps:
      - name: Vérifier la demande et récupérer l’archive déjà signée
        env:
          REQUESTED_BUILD: ${{ inputs.next_version_code }}
          REQUESTED_VERSION: ${{ inputs.marketing_version }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$REQUESTED_BUILD" == 131 && "$REQUESTED_VERSION" == 1.131 ]]
          [[ "$CORRELATION_ID" =~ ^[a-zA-Z0-9-]{1,64}$ ]]
          gh run download 34251235075 --repo VMeilhac85/compta --name maison-pilote-app-store-preparation --dir "$RUNNER_TEMP/prepared"
          python3 - <<'PY'
          import hashlib,json,os,plistlib,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'prepared'
          manifest=json.loads((root/'preparation-result.json').read_text())
          assert manifest['version_name']=='1.131' and manifest['version_code']==131
          assert manifest['source_commit']=='e0595ca0970e74d3ab413a3682528462db44960d'
          assert len(manifest['targets'])==4 and all(t['signature_verified'] for t in manifest['targets'])
          ipa=root/'export/Maison Pilote.ipa'
          assert hashlib.sha256(ipa.read_bytes()).hexdigest()==os.environ['EXPECTED_IPA_SHA256']==manifest['ipa_sha256']
          with zipfile.ZipFile(ipa) as z:
              targets=[plistlib.loads(z.read(n)) for n in z.namelist() if n.endswith(('.app/Info.plist','.appex/Info.plist'))]
              assert len(targets)==4
              assert all(t['CFBundleShortVersionString']=='1.131' and t['CFBundleVersion']=='131' for t in targets)
          print('IPA 1.131 (131) contrôlée : quatre cibles, empreinte identique au dossier approuvé.')
          PY
      - name: Valider et transmettre cette IPA à Apple
        env:
          IOS_ASC_PRIVATE_KEY: ${{ secrets.IOS_ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/upload/private_keys"
          trap 'rm -rf -- "$RUNNER_TEMP/upload/private_keys"' EXIT
          cd "$RUNNER_TEMP/upload"
          python3 - <<'PY'
          import os
          from pathlib import Path
          key=os.environ['IOS_ASC_PRIVATE_KEY'].strip()
          assert key.startswith('-----BEGIN PRIVATE KEY-----')
          Path('private_keys', 'AuthKey_'+os.environ['IOS_ASC_KEY_ID']+'.p8').write_text(key+'\n')
          PY
          xcrun altool --validate-app -f "$RUNNER_TEMP/prepared/export/Maison Pilote.ipa" -t ios --apiKey "$IOS_ASC_KEY_ID" --apiIssuer "$IOS_ASC_ISSUER_ID" --output-format json > "$RUNNER_TEMP/validation-apple.json"
          xcrun altool --upload-app -f "$RUNNER_TEMP/prepared/export/Maison Pilote.ipa" -t ios --apiKey "$IOS_ASC_KEY_ID" --apiIssuer "$IOS_ASC_ISSUER_ID" --output-format json > "$RUNNER_TEMP/upload-apple.json"
          python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          result={'version_code':131,'version_name':'1.131','build_number':'131','bundle_identifier':'expert.meilhac.maisonpilote','minimum_os_version':'16.4','team_identifier':os.environ['IOS_DEVELOPMENT_TEAM'],'testflight_url':os.environ['IOS_TESTFLIGHT_URL'],'ipa_sha256':os.environ['EXPECTED_IPA_SHA256'],'source_commit':'e0595ca0970e74d3ab413a3682528462db44960d','uploaded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'apple_upload_performed':True,'app_store_public_submission_performed':False}
          Path(os.environ['RUNNER_TEMP'],'release-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print('Transmission Apple terminée ; traitement TestFlight à vérifier.')
          PY
      - name: Conserver le résultat de transmission
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maison-pilote-ios-release-${{ inputs.correlation_id }}
          path: |
            ${{ runner.temp }}/release-result.json
            ${{ runner.temp }}/validation-apple.json
            ${{ runner.temp }}/upload-apple.json
          if-no-files-found: warn
          retention-days: 14
